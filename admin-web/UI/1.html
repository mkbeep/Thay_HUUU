<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Gourmet Tech</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "surface-variant": "#e5e2e1",
                        "on-primary-fixed-variant": "#872000",
                        "outline": "#916f67",
                        "secondary-container": "#e2dfde",
                        "primary": "#ad2c00",
                        "error-container": "#ffdad6",
                        "on-surface": "#1c1b1b",
                        "inverse-surface": "#313030",
                        "surface-dim": "#dcd9d9",
                        "secondary": "#5f5e5e",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#00210c",
                        "on-secondary-container": "#636262",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#4ae183",
                        "on-surface-variant": "#5c4038",
                        "surface-tint": "#b12d00",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-background": "#1c1b1b",
                        "primary-container": "#d83900",
                        "tertiary-fixed": "#6bfe9c",
                        "on-tertiary-fixed-variant": "#005228",
                        "surface": "#fcf9f8",
                        "inverse-primary": "#ffb5a0",
                        "tertiary": "#006a35",
                        "surface-container": "#f0eded",
                        "outline-variant": "#e5beb3",
                        "surface-container-high": "#eae7e7",
                        "primary-fixed": "#ffdbd1",
                        "on-secondary-fixed-variant": "#474746",
                        "on-primary-fixed": "#3b0900",
                        "inverse-on-surface": "#f3f0ef",
                        "tertiary-container": "#008645",
                        "primary-fixed-dim": "#ffb5a0",
                        "on-tertiary-container": "#f6fff4",
                        "surface-container-low": "#f6f3f2",
                        "secondary-fixed": "#e5e2e1",
                        "background": "#fcf9f8",
                        "on-primary-container": "#fffbff",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e5e2e1",
                        "surface-bright": "#fcf9f8"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .gourmet-gradient {
            background: linear-gradient(15deg, #ad2c00 0%, #d83900 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed">
<main class="min-h-screen flex flex-col md:flex-row overflow-hidden">
<!-- Left Side: Atmospheric Branding -->
<section class="hidden md:flex md:w-1/2 relative bg-surface-dim items-end p-12 lg:p-20 overflow-hidden">
<div class="absolute inset-0 z-0">
<img alt="Luxury plating" class="w-full h-full object-cover" data-alt="Close-up of a beautifully plated gourmet dish with vibrant microgreens on a dark ceramic plate in a dimly lit high-end kitchen" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2QFf-U72C9ct0Huxa7nLO0mm6qmAurmrznMwNvP68FpCjE6W1jbCRwJgMxJgeslxtC9-FhGf8TY8D4UTXb4G1oemn5pESLZMlgxrvtwre_A0yje_PpQ9xuKXqQRrjApSJd2bikNXuJ7DsyWCkz38eVj6lKEQNSehPdK-ToMd2RuvaH6ZB7RJXp34gieMuEsDuR81iv1b3kQtwecAdCNy9pOUNYKHiVhXzZksYZyjf0rCRRjML8Ws9DsGRu-kNzE-MVd5RopzjXQ"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
</div>
<div class="relative z-10 max-w-xl">
<div class="mb-6 inline-flex items-center px-4 py-2 rounded-full glass-panel border border-white/20">
<span class="material-symbols-outlined text-primary mr-2" data-icon="restaurant_menu">restaurant_menu</span>
<span class="text-on-surface font-headline font-bold tracking-tight text-sm uppercase">Excellence Served</span>
</div>
<h1 class="font-headline text-5xl lg:text-7xl font-extrabold text-white leading-[1.1] tracking-tighter mb-4">
                    Elevating the Art of Service.
                </h1>
<p class="font-headline text-xl lg:text-2xl text-white/80 font-medium tracking-tight">
                    Gourmet Tech: The Digital Maître d’
                </p>
</div>
</section>
<!-- Right Side: Login Interface -->
<section class="flex-1 flex items-center justify-center p-6 md:p-12 lg:p-24 bg-surface">
<div class="w-full max-w-[440px] space-y-10">
<!-- Logo & Header -->
<div class="flex flex-col items-center text-center space-y-4">
<div class="w-16 h-16 rounded-2xl gourmet-gradient flex items-center justify-center shadow-2xl shadow-primary/20">
<span class="material-symbols-outlined text-white text-3xl" data-icon="room_service" data-weight="fill" style="font-variation-settings: 'FILL' 1;">room_service</span>
</div>
<div>
<h2 class="font-headline text-3xl font-extrabold text-on-surface tracking-tighter">Welcome Back</h2>
<p class="text-secondary font-medium mt-1">Manage your culinary empire effortlessly.</p>
</div>
</div>
<!-- Login Form -->
<form class="space-y-6">
<div class="space-y-4">
<!-- Identity Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface ml-1" for="identity">Email or Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl" data-icon="alternate_email">alternate_email</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-surface-container-high border-none rounded-lg focus:ring-2 focus:ring-primary/40 text-on-surface transition-all placeholder:text-outline/60" id="identity" placeholder="chef@gourmet-tech.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface ml-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-surface-container-high border-none rounded-lg focus:ring-2 focus:ring-primary/40 text-on-surface transition-all placeholder:text-outline/60" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Utils -->
<div class="flex items-center justify-between">
<label class="flex items-center cursor-pointer group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20 transition-all cursor-pointer" type="checkbox"/>
<span class="ml-3 text-sm font-medium text-secondary group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="text-sm font-bold text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<!-- Action -->
<button class="w-full gourmet-gradient text-white font-headline font-bold text-lg py-4 rounded-xl shadow-xl shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200" type="submit">
                        Sign In
                    </button>
</form>
<!-- Footer / Switch -->
<div class="pt-8 text-center border-t border-outline-variant/20">
<p class="text-secondary font-medium">
                        New to Gourmet Tech? 
                        <a class="text-primary font-bold ml-1 hover:underline decoration-primary/30 underline-offset-4" href="#">Sign up for a new account</a>
</p>
</div>
</div>
</section>
</main>
<!-- Support Link Floating -->
<div class="fixed bottom-6 right-6">
<button class="flex items-center space-x-2 bg-surface-container-lowest shadow-lg px-4 py-2 rounded-full border border-outline-variant/10 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-secondary text-lg" data-icon="help_outline">help_outline</span>
<span class="text-sm font-semibold text-secondary">Contact Support</span>
</button>
</div>
</body></html>
