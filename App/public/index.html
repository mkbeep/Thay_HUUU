<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  
  <!-- Ngrok bypass -->
  <meta name="ngrok-skip-browser-warning" content="true" />
  
  <title>Thực Đơn Nhà Hàng</title>
  
  <!-- Prevent caching for dynamic content -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <style>
    * {
      box-sizing: border-box;
    }
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    #root {
      display: flex;
      flex-direction: column;
    }
    /* Loading screen */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 9999;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #AD2C00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 20px;
      color: #666;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <noscript>Bạn cần bật JavaScript để chạy ứng dụng này.</noscript>
  
  <div id="root">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-text">Đang tải thực đơn...</div>
    </div>
  </div>
  
  <script>
    // Ngrok bypass - add header to all fetch requests
    (function() {
      const originalFetch = window.fetch;
      window.fetch = function() {
        const args = Array.from(arguments);
        if (args[1]) {
          args[1].headers = args[1].headers || {};
          args[1].headers['ngrok-skip-browser-warning'] = 'true';
        } else {
          args[1] = {
            headers: {
              'ngrok-skip-browser-warning': 'true'
            }
          };
        }
        return originalFetch.apply(this, args);
      };
    })();
  </script>
</body>
</html>
