services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: restaurant-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=restaurant
    networks:
      - restaurant-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: restaurant-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    networks:
      - restaurant-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build: 
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: restaurant-auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/restaurant-auth
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=7d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - restaurant-network
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules

  # Menu Service
  menu-service:
    build: 
      context: ./services/menu-service
      dockerfile: Dockerfile
    container_name: restaurant-menu-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGODB_URI=mongodb://mongodb:27017/restaurant-menu
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - restaurant-network
    volumes:
      - ./services/menu-service:/app
      - /app/node_modules

  # Order Service
  order-service:
    build: 
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: restaurant-order-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGODB_URI=mongodb://mongodb:27017/restaurant-orders
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - restaurant-network
    volumes:
      - ./services/order-service:/app
      - /app/node_modules

  # Table Service
  table-service:
    build: 
      context: ./services/table-service
      dockerfile: Dockerfile
    container_name: restaurant-table-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - MONGODB_URI=mongodb://mongodb:27017/restaurant-tables
      - SESSION_SECRET=your-super-secret-session-key-change-in-production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - restaurant-network
    volumes:
      - ./services/table-service:/app
      - /app/node_modules

  # API Gateway
  api-gateway:
    build: 
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: restaurant-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - MENU_SERVICE_URL=http://menu-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - TABLE_SERVICE_URL=http://table-service:3004
    depends_on:
      - auth-service
      - menu-service
      - order-service
      - table-service
    networks:
      - restaurant-network
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules

  # Frontend Admin Web
  frontend-admin:
    build: 
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: restaurant-frontend-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
    depends_on:
      - api-gateway
    networks:
      - restaurant-network

  # Data Seeder (chạy 1 lần để seed data)
  data-seeder:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: restaurant-data-seeder
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - restaurant-network
    restart: "no"

networks:
  restaurant-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  rabbitmq_data:
    driver: local
