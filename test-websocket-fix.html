<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WebSocket - Restaurant System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        h1 {
            color: #2d3748;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .status.connected {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.disconnected {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status.connected .status-dot {
            background: #38a169;
        }
        
        .status.disconnected .status-dot {
            background: #e53e3e;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #2d3748;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .icon {
            font-size: 24px;
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #38a169 0%, #2f855a 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
            color: white;
        }
        
        .log-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .log-box {
            background: #1a202c;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 10px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 5px;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .log-entry.info {
            background: rgba(66, 153, 225, 0.1);
            border-left: 3px solid #4299e1;
        }
        
        .log-entry.success {
            background: rgba(72, 187, 120, 0.1);
            border-left: 3px solid #48bb78;
        }
        
        .log-entry.error {
            background: rgba(245, 101, 101, 0.1);
            border-left: 3px solid #f56565;
        }
        
        .log-entry.warning {
            background: rgba(237, 137, 54, 0.1);
            border-left: 3px solid #ed8936;
        }
        
        .timestamp {
            color: #a0aec0;
            font-size: 11px;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 WebSocket Test Tool</h1>
            <p style="color: #718096; margin-top: 10px;">Test real-time communication cho Restaurant System</p>
            <div style="margin-top: 15px;">
                <span class="status disconnected" id="status">
                    <span class="status-dot"></span>
                    Disconnected
                </span>
            </div>
        </div>

        <div class="grid">
            <!-- Connection Card -->
            <div class="card">
                <h2><span class="icon">🔌</span> Connection</h2>
                <input type="text" id="serverUrl" value="http://localhost:3000" placeholder="Server URL">
                <div class="btn-group">
                    <button class="btn-success" onclick="connect()">
                        <span>🔗</span> Connect
                    </button>
                    <button class="btn-danger" onclick="disconnect()">
                        <span>🔌</span> Disconnect
                    </button>
                </div>
            </div>

            <!-- Table Events Card -->
            <div class="card">
                <h2><span class="icon">🪑</span> Table Events</h2>
                <input type="text" id="tableId" placeholder="Table ID (e.g., T01)">
                <div class="btn-group">
                    <button class="btn-primary" onclick="joinTable()">
                        <span>🚪</span> Join Table
                    </button>
                    <button class="btn-warning" onclick="leaveTable()">
                        <span>🚶</span> Leave Table
                    </button>
                    <button class="btn-success" onclick="simulateTableUpdate()">
                        <span>📢</span> Simulate Table Update
                    </button>
                </div>
            </div>

            <!-- Order Events Card -->
            <div class="card">
                <h2><span class="icon">🍽️</span> Order Events</h2>
                <input type="text" id="orderId" placeholder="Order ID">
                <select id="orderStatus">
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="preparing">Preparing</option>
                    <option value="ready">Ready</option>
                    <option value="served">Served</option>
                </select>
                <div class="btn-group">
                    <button class="btn-primary" onclick="simulateOrderCreated()">
                        <span>➕</span> Simulate Order Created
                    </button>
                    <button class="btn-warning" onclick="simulateOrderStatusChanged()">
                        <span>🔄</span> Simulate Status Change
                    </button>
                </div>
            </div>

            <!-- Admin/Kitchen Card -->
            <div class="card">
                <h2><span class="icon">👤</span> Roles</h2>
                <div class="btn-group">
                    <button class="btn-primary" onclick="joinAdmin()">
                        <span>👨‍💼</span> Join as Admin
                    </button>
                    <button class="btn-primary" onclick="joinKitchen()">
                        <span>👨‍🍳</span> Join as Kitchen
                    </button>
                </div>
            </div>

            <!-- Payment Events Card -->
            <div class="card">
                <h2><span class="icon">💳</span> Payment Events</h2>
                <input type="text" id="paymentOrderId" placeholder="Order ID">
                <div class="btn-group">
                    <button class="btn-warning" onclick="simulatePaymentRequest()">
                        <span>💰</span> Request Payment
                    </button>
                    <button class="btn-success" onclick="simulatePaymentConfirm()">
                        <span>✅</span> Confirm Payment
                    </button>
                </div>
            </div>

            <!-- Stats Card -->
            <div class="card">
                <h2><span class="icon">📊</span> Statistics</h2>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="eventsReceived">0</div>
                        <div class="stat-label">Events Received</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="eventsSent">0</div>
                        <div class="stat-label">Events Sent</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="uptime">0s</div>
                        <div class="stat-label">Uptime</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Log Container -->
        <div class="log-container">
            <div class="log-header">
                <h2><span class="icon">📝</span> Event Log</h2>
                <button class="btn-danger" onclick="clearLog()">
                    <span>🗑️</span> Clear Log
                </button>
            </div>
            <div class="log-box" id="logBox"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let socket = null;
        let eventsReceived = 0;
        let eventsSent = 0;
        let startTime = null;
        let uptimeInterval = null;

        function log(message, type = 'info') {
            const logBox = document.getElementById('logBox');
            const timestamp = new Date().toLocaleTimeString('vi-VN');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateStats() {
            document.getElementById('eventsReceived').textContent = eventsReceived;
            document.getElementById('eventsSent').textContent = eventsSent;
        }

        function updateUptime() {
            if (startTime) {
                const seconds = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById('uptime').textContent = `${seconds}s`;
            }
        }

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            
            if (socket && socket.connected) {
                log('⚠️ Already connected', 'warning');
                return;
            }

            log(`🔗 Connecting to ${serverUrl}...`, 'info');
            
            socket = io(serverUrl, {
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionAttempts: 5
            });

            socket.on('connect', () => {
                log('✅ Connected successfully!', 'success');
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').innerHTML = '<span class="status-dot"></span> Connected';
                startTime = Date.now();
                uptimeInterval = setInterval(updateUptime, 1000);
            });

            socket.on('disconnect', () => {
                log('❌ Disconnected', 'error');
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').innerHTML = '<span class="status-dot"></span> Disconnected';
                if (uptimeInterval) {
                    clearInterval(uptimeInterval);
                    uptimeInterval = null;
                }
            });

            socket.on('connect_error', (error) => {
                log(`❌ Connection error: ${error.message}`, 'error');
            });

            // Listen to all events
            const events = [
                'order:created',
                'order:updated',
                'order:status_changed',
                'table:updated',
                'table:status_changed',
                'notification:new'
            ];

            events.forEach(event => {
                socket.on(event, (data) => {
                    eventsReceived++;
                    updateStats();
                    log(`📨 Received <strong>${event}</strong>: ${JSON.stringify(data)}`, 'success');
                });
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                log('🔌 Disconnected manually', 'warning');
            }
        }

        function joinTable() {
            const tableId = document.getElementById('tableId').value;
            if (!socket || !socket.connected) {
                log('❌ Not connected', 'error');
                return;
            }
            if (!tableId) {
                log('❌ Please enter table ID', 'error');
                return;
            }
            socket.emit('join:table', tableId);
            eventsSent++;
            updateStats();
            log(`🪑 Joined table: ${tableId}`, 'info');
        }

        function leaveTable() {
            const tableId = document.getElementById('tableId').value;
            if (!socket || !socket.connected) {
                log('❌ Not connected', 'error');
                return;
            }
            if (!tableId) {
                log('❌ Please enter table ID', 'error');
                return;
            }
            socket.emit('leave:table', tableId);
            eventsSent++;
            updateStats();
            log(`🚪 Left table: ${tableId}`, 'info');
        }

        function joinAdmin() {
            if (!socket || !socket.connected) {
                log('❌ Not connected', 'error');
                return;
            }
            socket.emit('join:admin');
            eventsSent++;
            updateStats();
            log('👨‍💼 Joined as Admin', 'info');
        }

        function joinKitchen() {
            if (!socket || !socket.connected) {
                log('❌ Not connected', 'error');
                return;
            }
            socket.emit('join:kitchen');
            eventsSent++;
            updateStats();
            log('👨‍🍳 Joined as Kitchen', 'info');
        }

        function simulateTableUpdate() {
            const tableId = document.getElementById('tableId').value || 'T01';
            log(`📢 Simulating table update for ${tableId}...`, 'warning');
            log('⚠️ This should be triggered from backend API', 'warning');
        }

        function simulateOrderCreated() {
            const orderId = document.getElementById('orderId').value || 'order_' + Date.now();
            log(`➕ Simulating order created: ${orderId}...`, 'warning');
            log('⚠️ This should be triggered from backend API', 'warning');
        }

        function simulateOrderStatusChanged() {
            const orderId = document.getElementById('orderId').value || 'order_123';
            const status = document.getElementById('orderStatus').value;
            log(`🔄 Simulating order status change: ${orderId} → ${status}...`, 'warning');
            log('⚠️ This should be triggered from backend API', 'warning');
        }

        function simulatePaymentRequest() {
            const orderId = document.getElementById('paymentOrderId').value || 'order_123';
            log(`💰 Simulating payment request for: ${orderId}...`, 'warning');
            log('⚠️ This should be triggered from backend API', 'warning');
        }

        function simulatePaymentConfirm() {
            const orderId = document.getElementById('paymentOrderId').value || 'order_123';
            log(`✅ Simulating payment confirmation for: ${orderId}...`, 'warning');
            log('⚠️ This should be triggered from backend API', 'warning');
        }

        function clearLog() {
            document.getElementById('logBox').innerHTML = '';
            log('🗑️ Log cleared', 'info');
        }

        // Auto-connect on load
        window.addEventListener('load', () => {
            log('🚀 WebSocket Test Tool loaded', 'info');
            log('💡 Click "Connect" to start testing', 'info');
        });
    </script>
</body>
</html>
